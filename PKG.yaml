schema_version: 1
id: qq
version: 0.2
compat: ">= 0.3"
members: [qq]
connectors:
  - name: qq-cli
    path: connectors/qq-cli
depends: [framework]
uninstall:
  retains: [wiki/qq/, wiki/cron/qq-inbox.md]
  credentials: [~/.qq-cli/]
  bridges: []
  processes: ["qq-listen.service", "qq-agent.timer", "qq-cli listen", "com.qq-cli.listen", "com.qq-cli.agent", "owfa-qq-listen", "owfa-qq-agent"]
disclosure: "Official QQ Bot platform (api.bot.qq.com) via qq-cli: WebSocket event intake and passive replies; processes QQ message text and per-bot openids (privacy: high); whitelisted private chats and groups only; app credentials and raw message buffers stay on this machine (~/.qq-cli), never in the repository; replies are generated by the agent session strictly from wiki/vault content."
menu:
  qq: QQ chat domain — whitelist policy, public audience subset, inbox/reply workflow
